# =============================================================================
# Cloud Build — CI gates
#
# Why this exists
# ---------------
# GitHub Actions minutes are metered on a private repository, and this repo's CI is heavy: the
# `queue` phase alone runs the full test suite, a type-check, two Vite builds and a Playwright
# run. When the repo is private, that bill lands on a quota that also has to cover deploys.
#
# This file runs the same gates on Cloud Build, where the cost is per-minute compute in a project
# we already pay for. It is modelled on hushh-labs/hushh-search-console: a fan rather than a line,
# so the gates run concurrently after a single dependency install instead of serially.
#
# The default pull-request code gate is the `hushh-tech-website-ci` Cloud Build
# trigger. It reports its result back to GitHub; the checked-in
# `Cloud Build Status Gate` workflow combines that result with the lightweight
# GitHub PR policy check and publishes the required `CI Status Gate` status.
# `.github/workflows/ci.yml` remains available as an explicit full GitHub backup.
#
# To wire it (the 2nd-gen GitHub connection `hushh-github` already exists in us-central1):
#
#   npm run gcp:ci-trigger:plan
#   npm run gcp:ci-trigger:apply
#
# PR-metadata jobs (DCO, PR hygiene, semantic guard, Phase 2 policy) stay in the
# GitHub `PR Policy Gate` because Cloud Build does not receive pull-request body
# context. The status adapter joins that policy result with these code gates.
# =============================================================================

steps:
  # ---------------------------------------------------------------------------
  # Branch freshness. Blocking, and first, because everything below it is a statement about a tree
  # that has to be the one we intend to ship. A branch behind `main` was validated against code
  # nobody will run, and merging it overwrites whatever landed in the meantime with a stale copy.
  #
  # This runs before `install` deliberately: a git ancestry check costs seconds, `npm ci` plus the
  # fan costs minutes, and on a stale branch every one of those minutes is spent on the wrong tree.
  #
  # The gate handles the shape Cloud Build produces — shallow, detached, single-branch — rather
  # than skipping on it. See scripts/git/check-main-sync.sh for why that mattered.
  # ---------------------------------------------------------------------------
  - id: freshness
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["-"]
    env:
      - MAIN_SYNC_MODE=block
      # The helper below has just fetched the base; the gate must not try to fetch it again.
      - MAIN_SYNC_FETCH=0
      - MAIN_SYNC_BRANCH=${_FRESHNESS_BASE_BRANCH}
      # Substitutions are not environment variables inside a step, so the branch under test has to
      # be handed over explicitly. Without it the report reads "master", the name Cloud Build's
      # fetcher gives every checkout regardless of the real branch.
      - MAIN_SYNC_LABEL=${BRANCH_NAME}
    args:
      - -c
      - |
        set -euo pipefail
        # A build step cannot reach this repository on its own: the trigger's clone credential is
        # consumed by the source fetch and never reaches the steps, so a plain `git fetch` runs
        # anonymously and gets a 403 now that the repository is private. This mints a short-lived
        # read token from the Cloud Build connection — the same grant and the same child-only
        # header plumbing scripts/ci/prepare-repository-history.mjs already uses — and needs no
        # node_modules, so it runs before `npm ci` rather than after it.
        node scripts/ci/fetch-base-branch.mjs "${_FRESHNESS_BASE_BRANCH}"
        bash scripts/ci/orchestrate.sh freshness

  # ---------------------------------------------------------------------------
  # Merge fidelity. Advisory, and deliberately so: every pass is a text heuristic that flags a
  # deliberate supersession as loudly as a silent revert, so it reports and a human decides.
  #
  # `warn` keeps the step green while printing its findings; `allowFailure` is the second belt, so
  # that an internal error in the detector cannot fail a build over an advisory check. The one
  # thing it must never do is stay quiet when it could not look — the script reports that as
  # INCONCLUSIVE rather than as a pass.
  #
  # It waits on `freshness` for two reasons: that step is what puts origin/<base> in this workspace
  # (see the token note above — nothing here can fetch it unaided), and on a branch that is behind,
  # every commit the base gained reads as dropped content. That is the freshness gate's finding,
  # and it blocks.
  # ---------------------------------------------------------------------------
  - id: fidelity
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["freshness"]
    allowFailure: true
    env:
      - MERGE_FIDELITY_MODE=warn
      - MERGE_FIDELITY_BASE_REF=origin/${_FRESHNESS_BASE_BRANCH}
    args:
      - -c
      - |
        bash scripts/ci/orchestrate.sh fidelity
        # Same step, because both are advisory reports over the same git checkout and a second
        # container pull would cost more than the check does.
        bash scripts/ci/orchestrate.sh dead-modules

  # ---------------------------------------------------------------------------
  # Restore the npm cache. Keyed on the lockfile hash, so a dependency change misses cleanly
  # rather than resurrecting a stale tree. A cache miss is normal and must never fail the build,
  # hence the `|| true` — this step is an optimisation, not a gate.
  # ---------------------------------------------------------------------------
  - id: cache-restore
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -c
      - |
        set -u
        hash="$$(sha256sum package-lock.json | cut -c1-32)"
        echo "$$hash" > /workspace/.npm-cache-key
        gsutil -q cp "gs://${_CACHE_BUCKET}/npm-v2/$$hash.tar.gz" /workspace/npm-cache.tar.gz || true
        if [ -f /workspace/npm-cache.tar.gz ]; then
          tar -xzf /workspace/npm-cache.tar.gz -C /workspace || rm -f /workspace/npm-cache.tar.gz
          echo "npm cache hit for $$hash"
        else
          echo "npm cache miss for $$hash"
        fi

  - id: install
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["cache-restore", "freshness"]
    args:
      - -c
      - |
        set -euo pipefail
        npm ci --no-audit --no-fund --cache /workspace/.npm-cache --prefer-offline

  # Web and service evidence tests verify historical bytes AND ancestry.
  # Match Actions' fetch-depth: 0 for the exact tested HEAD, without checking
  # out a moving branch or relaxing any provenance/hash assertions.
  - id: repository-history
    name: node:20.19.0
    entrypoint: node
    waitFor: ["install"]
    args: ["scripts/ci/prepare-repository-history.mjs"]

  # ---------------------------------------------------------------------------
  # The fan. Every step below waits only on `install`, so they run concurrently. Adding a gate
  # here costs the length of that gate, not the length of the pipeline.
  # ---------------------------------------------------------------------------
  - id: web
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["install", "repository-history"]
    args:
      - -c
      - |
        set -euo pipefail
        bash scripts/ci/orchestrate.sh web
        node scripts/ci/check-deploy-build-context.mjs

  - id: lint
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "set -euo pipefail; bash scripts/ci/orchestrate.sh lint"]

  - id: env-contract
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "set -euo pipefail; bash scripts/ci/orchestrate.sh env"]

  - id: retirement
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "set -euo pipefail; bash scripts/ci/orchestrate.sh retirement"]

  # Generate the route/source inventory while the web gate is building. The
  # runtime half below reuses the web step's dist/ output instead of building
  # the application a second time in the same Cloud Build.
  - id: no-hybrid-contract
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["install"]
    args:
      - -c
      - |
        set -euo pipefail
        npm run migration:no-hybrid:routes
        npm run migration:no-hybrid:source

  - id: no-hybrid-runtime
    name: mcr.microsoft.com/playwright:v1.57.0-noble
    entrypoint: bash
    waitFor: ["web", "no-hybrid-contract"]
    args:
      - -c
      - |
        set -euo pipefail
        # The version-pinned Playwright image already contains the Chromium and
        # WebKit system dependencies and browser binaries. Keep this inventory
        # check read-only so every build avoids a repeated apt/browser download.
        npx playwright install --list
        npm run migration:no-hybrid:check
        npm run test:e2e:no-hybrid

  # Cloud Run service package: its own lockfile, its own audit budget.
  - id: service
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["install", "repository-history"]
    args:
      - -c
      - |
        set -euo pipefail
        NPM_CONFIG_CACHE=/workspace/.npm-cache bash scripts/ci/orchestrate.sh service

  - id: security-audit
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["install"]
    args:
      - -c
      - |
        set -euo pipefail
        mkdir -p tmp/ci
        npm audit --json > tmp/ci/npm-audit-report.json || true
        node scripts/ci/check-audit-regression.mjs tmp/ci/npm-audit-report.json

  - id: sensitive-nda-gate
    name: node:20.19.0
    entrypoint: bash
    waitFor: ["install"]
    args:
      - -c
      - |
        set -euo pipefail
        npm run test -- tests/communityApiRoute.test.ts tests/communityGcpRuntime.test.ts
        node --check scripts/community/verify-sensitive-nda-gate.mjs

  - id: secret-scan
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: sh
    waitFor: ["-"]
    args: ["-c", "gitleaks detect --source . --no-git --redact --exit-code 1"]

  # ---------------------------------------------------------------------------
  # Save the cache once the install is known good. Runs last and never fails the build.
  # ---------------------------------------------------------------------------
  - id: cache-save
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    waitFor: ["web", "lint", "env-contract", "retirement", "no-hybrid-runtime", "service", "security-audit", "sensitive-nda-gate"]
    args:
      - -c
      - |
        set -u
        hash="$$(cat /workspace/.npm-cache-key)"
        if ! gsutil -q stat "gs://${_CACHE_BUCKET}/npm-v2/$$hash.tar.gz"; then
          tar -czf /workspace/npm-cache-new.tar.gz .npm-cache || exit 0
          gsutil -q cp /workspace/npm-cache-new.tar.gz "gs://${_CACHE_BUCKET}/npm-v2/$$hash.tar.gz" || true
        fi

substitutions:
  _CACHE_BUCKET: hushh-tech-uat_cloudbuild
  # The branch a pull request targets. A dedicated name rather than Cloud Build's `_BASE_BRANCH`,
  # which only exists on pull-request builds — a manual or branch build would fail to substitute it
  # and the whole config would be rejected before any gate ran.
  _FRESHNESS_BASE_BRANCH: main

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'
