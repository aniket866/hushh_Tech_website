# =============================================================================
# Cloud Build — UAT image build (hushh-tech-uat project)
#
# NOT WIRED. There is no Cloud Build trigger for this file, and its `_VITE_*` substitutions have
# no defaults, so it only runs if someone supplies them by hand. It is kept as the image-build
# reference for that case; the deploy half was removed (see Step 3 below) because it would have
# stripped the service's configuration.
#
# The working paths are:
#   release  — .github/workflows/deploy-uat.yml (green `main` only)
#   branch   — node scripts/deploy/uat-deploy.mjs
# =============================================================================

steps:
  # Step 1: Build Docker image with VITE_* build args
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.gcp'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'VITE_GCP_API_BASE_URL=https://uat.hushhtech.com'
      - '--build-arg'
      - 'VITE_GCP_AUTH_REDIRECT_URL=${_VITE_GCP_AUTH_REDIRECT_URL}'
      - '--build-arg'
      - 'VITE_KYC_ENV=${_VITE_KYC_ENV}'
      - '--build-arg'
      - 'VITE_KYC_DEMO_MODE=${_VITE_KYC_DEMO_MODE}'
      - '--build-arg'
      - 'VITE_KYC_API_BASE=${_VITE_KYC_API_BASE}'
      - '--build-arg'
      - 'VITE_GEMINI_API_KEY=${_VITE_GEMINI_API_KEY}'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - '.'

  # Step 2: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest']

  # Step 3: Deploy to Cloud Run (UAT)
  #
  # REMOVED — this step was actively dangerous.
  #
  # It deployed with `--set-env-vars` and `--set-secrets`, both of which REPLACE the revision's
  # configuration rather than merging into it. The live UAT revision carries 30 plain env vars and
  # 18 secret-backed ones: Cloud SQL wiring, the Firebase project, the Research client, GA4 and
  # Search Console. This file named five and eleven. Running it would have dropped roughly two
  # thirds of the service's configuration in a single command, and the deploy would have reported
  # success.
  #
  # The deploy is now a read-modify-write against the Cloud Run Admin v2 API, which changes only
  # the image, DEPLOY_COMMIT_SHA and the revision labels and carries everything else through:
  #
  #   node scripts/deploy/uat-deploy.mjs            # build from HEAD and deploy
  #   node scripts/deploy/uat-deploy.mjs --dry-run  # print the build and the resulting patch
  #
  # The release path for `main` remains .github/workflows/deploy-uat.yml, which uses the merging
  # `--update-env-vars` form. If this file is ever revived, it must use that form too.

# Only the substitutions the remaining build step actually reads. The runtime env and secret
# substitutions that used to live here belonged to the deleted deploy step; leaving them would
# imply this file still configures the service, which it does not.
substitutions:
  _SERVICE_NAME: hushh-tech-website
  _VITE_KYC_ENV: staging
  _VITE_KYC_DEMO_MODE: 'true'

timeout: '1200s'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
