name: Deploy to PROD
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact green main SHA to deploy to production
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20.19.0"
  SMOKE_BASE_URL: https://hushhtech.com
  SHARED_SECRETS_PROJECT: "53407187172"
  VITE_GCP_AUTH_REDIRECT_URL: https://hushhtech.com/auth/callback
  VITE_PLAID_REDIRECT_URI: https://hushhtech.com/onboarding/financial-link
  VITE_FIREBASE_AUTH_DOMAIN: hushhtech.com
  VITE_FIREBASE_API_KEY: ci-anon-key
  VITE_FIREBASE_PROJECT_ID: hushh-tech-prod
  VITE_FIREBASE_APP_ID: ci-app-id
  VITE_ALLOW_INSECURE_BROWSER_LLM: "false"
  # Production keeps the GCP data plane fail-closed until its own database
  # parity and migration evidence are complete. GCP-only secret bindings below
  # must follow this flag so a disabled plane cannot block a web release.
  # Re-enable only after the production data-plane attestation is complete.
  # This guard is intentionally reviewed with every production workflow change.
  GCP_DATA_RUNTIME_ENABLED: "false"
  HUSHH_RESEARCH_CLIENT_ENABLED: "false"

jobs:
  deploy:
    name: Build & Deploy to Cloud Run (PROD)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: Production – hushh-tech
      url: https://hushhtech.com
    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing production deploy from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate deployment SHA against green main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: Main Post-Merge Smoke Gate
        run: bash scripts/ci/require-deploy-sha-on-main.sh "${{ github.event.inputs.sha }}"

      - name: Checkout deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ github.event.inputs.sha }}"

      # 1. Prepare Node.js and dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Verify exhaustive route inventory
        run: npm run migration:no-hybrid:routes

      - name: Validate no-hybrid source contract
        run: npm run migration:no-hybrid:source

      # 2. Auth with GCP and load shared web-build secrets
      # Prefer an environment-scoped GCP_SA_KEY_PROD secret so deploy approval gates access.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP project context
        run: gcloud config set project hushh-tech-prod

      - name: Assert GCP project scope
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [ "$ACTIVE_PROJECT" != "hushh-tech-prod" ]; then
            echo "Refusing deploy: expected project 'hushh-tech-prod' but got '$ACTIVE_PROJECT'."
            exit 1
          fi

      # Apple returns HTTP 200 for both its sign-in page and an invalid return
      # URL. Verify the exact new same-origin callback before changing traffic.
      - name: Verify production Apple callback registration
        run: node scripts/smoke-prod-apple-allowlist.mjs

      - name: Refuse drifted Research bindings in production
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe hushh-tech-website \
            --project=hushh-tech-prod \
            --region=us-central1 \
            --format=json)"
          jq -e '
            ([.spec.template.spec.containers[0].env[]?
              | select(.name == "HUSHH_RESEARCH_CLIENT_ENABLED")]
              | length == 0)
            or
            ([.spec.template.spec.containers[0].env[]?
              | select(.name == "HUSHH_RESEARCH_CLIENT_ENABLED")]
              == [{"name":"HUSHH_RESEARCH_CLIENT_ENABLED","value":"false"}])
          ' <<<"$service_json" >/dev/null
          jq -e '
            [.spec.template.spec.containers[0].env[]?
              | select(.name != "HUSHH_RESEARCH_CLIENT_ENABLED")
              | select(.name | startswith("HUSHH_RESEARCH_"))]
              | length == 0
          ' <<<"$service_json" >/dev/null

      - name: Load web auth build env from Secret Manager
        shell: bash
        run: |
          set -euo pipefail
          firebase_auth_domain="hushhtech.com"
          firebase_project_id="hushh-tech-prod"
          firebase_api_key="$(gcloud secrets versions access latest --project=hushh-tech-prod --secret=hushh-tech-firebase-web-api-key)"
          firebase_app_id="$(gcloud secrets versions access latest --project=hushh-tech-prod --secret=hushh-tech-firebase-web-app-id)"
          if [ -z "$firebase_auth_domain" ] || [ -z "$firebase_project_id" ] || [ -z "$firebase_api_key" ] || [ -z "$firebase_app_id" ]; then
            echo "::error::Firebase web auth secrets are empty"
            exit 1
          fi

          runtime_secret_names=(
            hushh-tech-firebase-web-api-key
            hushh-tech-firebase-web-app-id
            hushh-tech-gemini-api-key
            hushh-tech-analytics-hash-salt
            hushh-tech-metrics-ga4-property-id
            hushh-tech-metrics-ga4-allowed-hostnames
            hushh-tech-metrics-gcp-monitoring-project-id
            hushh-tech-metrics-gcp-cloud-run-region
            hushh-tech-metrics-gcp-cloud-run-services
            hushh-tech-metrics-search-console-site-url
            hushh-tech-metrics-search-console-type
            hushh-tech-metrics-search-console-data-state
            hushh-tech-metrics-search-console-row-limit
            hushh-tech-metrics-looker-studio-embed-url
          )

          if [ "$GCP_DATA_RUNTIME_ENABLED" = "true" ]; then
            runtime_secret_names+=(
              hushh-tech-cloudsql-instance
              hushh-tech-server-actor-uid
            )
          fi

          for secret_name in "${runtime_secret_names[@]}"; do
            if ! gcloud secrets describe "$secret_name" --project=hushh-tech-prod >/dev/null 2>&1; then
              echo "::error::Required production runtime secret '$secret_name' is missing"
              exit 1
            fi
          done

          gmail_user_secret_present=0
          gmail_password_secret_present=0
          if gcloud secrets describe hushh-tech-gmail-user --project=hushh-tech-prod >/dev/null 2>&1; then
            gmail_user_secret_present=1
          fi
          if gcloud secrets describe hushh-tech-gmail-app-password --project=hushh-tech-prod >/dev/null 2>&1; then
            gmail_password_secret_present=1
          fi

          if [ "$gmail_user_secret_present" -ne "$gmail_password_secret_present" ]; then
            echo "::error::Production Gmail runtime secrets must be configured as a pair."
            exit 1
          fi

          if [ "$gmail_user_secret_present" -eq 1 ]; then
            printf 'GMAIL_RUNTIME_SECRETS_AVAILABLE=1\n' >> "$GITHUB_ENV"
          else
            printf 'GMAIL_RUNTIME_SECRETS_AVAILABLE=0\n' >> "$GITHUB_ENV"
            echo "Optional production Gmail runtime secrets are not configured; preserving current Cloud Run behavior without Gmail env bindings."
          fi

          echo "::add-mask::$firebase_auth_domain"
          echo "::add-mask::$firebase_api_key"
          echo "::add-mask::$firebase_app_id"
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$firebase_auth_domain" >> "$GITHUB_ENV"
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$firebase_api_key" >> "$GITHUB_ENV"
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$firebase_project_id" >> "$GITHUB_ENV"
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$firebase_app_id" >> "$GITHUB_ENV"

      # 3. Build Vite app in runner (FAST)
      - name: Validate client auth env
        shell: bash
        run: |
          missing=0
          for name in VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_GCP_AUTH_REDIRECT_URL VITE_PLAID_REDIRECT_URI VITE_ALLOW_INSECURE_BROWSER_LLM; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for the web auth build"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "$VITE_ALLOW_INSECURE_BROWSER_LLM" != "false" ]; then
            echo "::error::VITE_ALLOW_INSECURE_BROWSER_LLM must remain false in production."
            exit 1
          fi
      - run: npm run env:check
      - run: npm run build:web
      - name: Validate no-hybrid deploy artifact
        run: npm run migration:no-hybrid:check

      # 4. Deploy pre-built dist/ to Cloud Run (runtime-only Dockerfile)
      - name: Deploy to Cloud Run
        shell: bash
        run: |
          deploy_sha="${{ github.event.inputs.sha }}"
          if ! [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment input must be a full lowercase Git SHA."
            exit 1
          fi
          short_sha="${deploy_sha:0:8}"
          runtime_env="NODE_ENV=production,DEPLOY_COMMIT_SHA=${deploy_sha},COMMUNITY_CONTENT_BACKEND=gcp,COMMUNITY_CONTENT_COLLECTION=community_posts,COMMUNITY_CONTENT_BUCKET=hushh-tech-community-content-prod,COMMUNITY_CONTENT_CACHE_SECONDS=300,GEMINI_INVESTOR_PROFILE_PROVIDER=vertex,GEMINI_INVESTOR_PROFILE_MODEL=gemini-2.5-flash,GOOGLE_CLOUD_PROJECT=hushh-tech-prod,GOOGLE_CLOUD_LOCATION=us-central1,GCP_DATA_RUNTIME_ENABLED=${GCP_DATA_RUNTIME_ENABLED},CLOUD_SQL_INSTANCE_CONNECTION_NAME=hushh-tech-prod:us-central1:hushh-tech-app-pg-prod,CLOUD_SQL_DATABASE=hushh_tech_app,CLOUD_SQL_IAM_USER=hushh-tech-web-prod@hushh-tech-prod.iam,FIREBASE_PROJECT_ID=hushh-tech-prod,GCP_STORAGE_BUCKET_PREFIX=hushh-tech-prod,PROFILE_INTELLIGENCE_API_BASE_URL=https://hushh-ria-intelligence-api-53407187172.us-central1.run.app,PROFILE_INTELLIGENCE_TIMEOUT_MS=180000,PROFILE_INTELLIGENCE_DISABLED=true,HUSHH_RESEARCH_CLIENT_ENABLED=false"
          runtime_secrets="GEMINI_API_KEY=hushh-tech-gemini-api-key:latest"
          if [ "$GCP_DATA_RUNTIME_ENABLED" = "true" ]; then
            runtime_secrets="CLOUD_SQL_INSTANCE_CONNECTION_NAME=hushh-tech-cloudsql-instance:latest"
            runtime_secrets+=",GCP_SERVER_ACTOR_UID=hushh-tech-server-actor-uid:latest"
            runtime_secrets+=",GEMINI_API_KEY=hushh-tech-gemini-api-key:latest"
          fi
          if [ "${GMAIL_RUNTIME_SECRETS_AVAILABLE:-0}" = "1" ]; then
            runtime_secrets+=",GMAIL_USER=hushh-tech-gmail-user:latest"
            runtime_secrets+=",GMAIL_APP_PASSWORD=hushh-tech-gmail-app-password:latest"
          fi
          runtime_secrets+=",ANALYTICS_HASH_SALT=hushh-tech-analytics-hash-salt:latest"
          runtime_secrets+=",GA4_PROPERTY_ID=hushh-tech-metrics-ga4-property-id:latest"
          runtime_secrets+=",GA4_ALLOWED_HOSTNAMES=hushh-tech-metrics-ga4-allowed-hostnames:latest"
          runtime_secrets+=",GCP_MONITORING_PROJECT_ID=hushh-tech-metrics-gcp-monitoring-project-id:latest"
          runtime_secrets+=",GCP_CLOUD_RUN_REGION=hushh-tech-metrics-gcp-cloud-run-region:latest"
          runtime_secrets+=",GCP_CLOUD_RUN_SERVICES=hushh-tech-metrics-gcp-cloud-run-services:latest"
          runtime_secrets+=",SEARCH_CONSOLE_SITE_URL=hushh-tech-metrics-search-console-site-url:latest"
          runtime_secrets+=",SEARCH_CONSOLE_TYPE=hushh-tech-metrics-search-console-type:latest"
          runtime_secrets+=",SEARCH_CONSOLE_DATA_STATE=hushh-tech-metrics-search-console-data-state:latest"
          runtime_secrets+=",SEARCH_CONSOLE_ROW_LIMIT=hushh-tech-metrics-search-console-row-limit:latest"
          runtime_secrets+=",LOOKER_STUDIO_EMBED_URL=hushh-tech-metrics-looker-studio-embed-url:latest"
          build_tag="build-${short_sha}"
          gcloud run deploy hushh-tech-website \
            --source . \
            --project=hushh-tech-prod \
            --tag="$build_tag" \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --port=8080 \
            --timeout=240s \
            --update-env-vars="$runtime_env" \
            --set-secrets="$runtime_secrets" \
            --update-labels="deploy-env=production,deploy-commit=${deploy_sha},deploy-tag=prod-${short_sha}" \
            --clear-base-image \
            --quiet

      - name: Verify exact production release identity
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="${{ github.event.inputs.sha }}"
          service_json="$(gcloud run services describe hushh-tech-website \
            --project=hushh-tech-prod \
            --region=us-central1 \
            --format=json)"
          serving_revision="$(jq -r '
            [.status.traffic[]?
              | select((.percent // 0) == 100)
              | .revisionName
              | select(type == "string" and length > 0)]
            | if length == 1 then .[0] else empty end
          ' <<<"$service_json")"
          positive_traffic_targets="$(jq '[.status.traffic[]? | select((.percent // 0) > 0)] | length' <<<"$service_json")"
          if [ -z "$serving_revision" ] || [ "$positive_traffic_targets" -ne 1 ]; then
            echo "::error::Expected exactly one production revision at 100% traffic after deploy."
            exit 1
          fi
          revision_json="$(gcloud run revisions describe "$serving_revision" \
            --project=hushh-tech-prod \
            --region=us-central1 \
            --format=json)"
          label_sha="$(jq -r '.metadata.labels["deploy-commit"] // empty' <<<"$revision_json")"
          env_sha="$(jq -r '
            [.spec.containers[0].env[]?
              | select(.name == "DEPLOY_COMMIT_SHA")
              | .value
              | select(type == "string")]
            | if length == 1 then .[0] else empty end
          ' <<<"$revision_json")"
          image_digest="$(jq -r '.status.imageDigest // empty' <<<"$revision_json")"
          if [ "$label_sha" != "$deploy_sha" ] || [ "$env_sha" != "$deploy_sha" ]; then
            echo "::error::Production revision does not bind the exact deployment SHA."
            exit 1
          fi
          if ! [[ "$image_digest" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Production revision does not expose an immutable image digest."
            exit 1
          fi
          release_json="$(curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 \
            "$SMOKE_BASE_URL/api/release")"
          if [ "$(jq -r '.status // empty' <<<"$release_json")" != "ok" ] || \
             [ "$(jq -r '.service // empty' <<<"$release_json")" != "hushh-tech-website" ] || \
             [ "$(jq -r '.revision // empty' <<<"$release_json")" != "$serving_revision" ] || \
             [ "$(jq -r '.commit_sha // empty' <<<"$release_json")" != "$deploy_sha" ]; then
            echo "::error::The served production release identity does not match the deployed revision."
            exit 1
          fi
          jq -n \
            --arg sha "$deploy_sha" \
            --arg revision "$serving_revision" \
            --arg image "$image_digest" \
            '{status:"verified",commit_sha:$sha,serving_revision:$revision,image_digest:$image,traffic_percent:100}' \
            > /tmp/prod-release-identity.json

      - name: Verify Research client remains absent in production
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HUSHH_RESEARCH_CLIENT_ENABLED=false \
            node scripts/smoke-hushh-research-client.mjs "$SMOKE_BASE_URL" \
            > /tmp/prod-hushh-research-client-smoke.json
          service_json="$(gcloud run services describe hushh-tech-website \
            --project=hushh-tech-prod \
            --region=us-central1 \
            --format=json)"
          jq -e '
            [.spec.template.spec.containers[0].env[]?
              | select(.name == "HUSHH_RESEARCH_CLIENT_ENABLED")]
              == [{"name":"HUSHH_RESEARCH_CLIENT_ENABLED","value":"false"}]
            and
            ([.spec.template.spec.containers[0].env[]?
              | select(.name != "HUSHH_RESEARCH_CLIENT_ENABLED")
              | select(.name | startswith("HUSHH_RESEARCH_"))]
              | length == 0)
          ' <<<"$service_json" >/dev/null

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke OAuth startup on deployed host
        run: node scripts/smoke-oauth-start.mjs "$SMOKE_BASE_URL" --prod-auth-domain > /tmp/prod-oauth-smoke.json

      - name: Upload production smoke artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: prod-oauth-smoke
          if-no-files-found: error
          retention-days: 7
          path: /tmp/prod-oauth-smoke.json

      - name: Upload production Research hard-off proof
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: prod-hushh-research-client-smoke
          if-no-files-found: error
          retention-days: 7
          path: /tmp/prod-hushh-research-client-smoke.json
