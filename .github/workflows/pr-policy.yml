name: PR Policy

# GitHub keeps the small amount of policy that requires pull-request metadata
# (DCO, body hygiene, reviewer grounding, and Phase 2 eligibility). Code and
# browser execution happen in the Cloud Build trigger; this workflow never
# installs the application or runs the heavy test/build fan-out.
on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - review_requested

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.19.0"

jobs:
  policy:
    name: PR Policy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate signed-off commits
        run: bash scripts/ci/check-dco.sh

      # Freshness is a property of the pull request, like DCO, so it lives with the policy gate
      # rather than in a job of its own: it costs one git command on a checkout that already has
      # full history, and it joins the required `CI Status Gate` with no change to the adapter.
      #
      # MAIN_SYNC_HEAD is the PR's HEAD COMMIT, not the checkout. `actions/checkout` resolves a
      # pull_request event to refs/pull/N/merge — GitHub's preview of the merge result, which
      # contains the base tip by construction. Checked against that ref this gate would report
      # fresh for every pull request ever opened, including the stale ones. Cloud Build is the
      # default runner for this gate; this is the parity copy, and it has to answer the same
      # question the Cloud Build step does.
      - name: Branch freshness
        env:
          MAIN_SYNC_MODE: block
          MAIN_SYNC_HEAD: ${{ github.event.pull_request.head.sha }}
          MAIN_SYNC_BRANCH: ${{ github.event.pull_request.base.ref }}
          MAIN_SYNC_LABEL: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/ci/orchestrate.sh freshness

      # Advisory, matching the Cloud Build step. `continue-on-error` is the second belt behind the
      # script's own warn mode, so a detector that breaks cannot fail the required status over a
      # heuristic. Read its findings in the step summary.
      - name: Merge fidelity (advisory)
        continue-on-error: true
        env:
          MERGE_FIDELITY_MODE: warn
          MERGE_FIDELITY_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          git checkout --quiet --detach "${{ github.event.pull_request.head.sha }}"
          bash scripts/ci/orchestrate.sh fidelity

      - name: Verify reviewer grounding and compliance sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          required_files = [
              ".pr_agent.toml",
              ".ai_config.toml",
              "AGENTS.md",
              "QODO.MD",
              "best_practices.md",
              "docs/project_context_map.md",
              "pr_compliance_checklist.yaml",
          ]
          for file_name in required_files:
              if not pathlib.Path(file_name).is_file():
                  raise SystemExit(f"required reviewer source missing: {file_name}")

          with open(".pr_agent.toml", "rb") as fh:
              pr_agent = tomllib.load(fh)
          with open(".ai_config.toml", "rb") as fh:
              tomllib.load(fh)
          config = pr_agent.get("config", {})
          if config.get("add_repo_metadata") is not True:
              raise SystemExit(".pr_agent.toml must enable add_repo_metadata = true")
          metadata_files = set(config.get("add_repo_metadata_file_list", []))
          required_metadata = {"AGENTS.md", "QODO.MD", "pr_compliance_checklist.yaml"}
          missing = sorted(required_metadata - metadata_files)
          if missing:
              raise SystemExit("reviewer metadata missing: " + ", ".join(missing))
          PY
          ruby -e 'require "yaml"; YAML.load_file("pr_compliance_checklist.yaml")'

      - name: Validate pull-request body
        run: npm run pr:hygiene

      - name: Validate Phase 2 policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-phase2-pr-policy.mjs

      - name: Run semantic policy guard in advisory mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_PR_GUARD_MODE: advisory
        run: node scripts/ci/check-pr-semantic-guardrails.mjs
