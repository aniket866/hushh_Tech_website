name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.19.0"
  SERVICE_NODE_VERSION: "22.23.2"
  ATTESTOR_NODE_VERSION: "22.22.0"
  VITE_FIREBASE_AUTH_DOMAIN: "hushh-tech-uat.firebaseapp.com"
  VITE_FIREBASE_API_KEY: "ci-anon-key"
  VITE_FIREBASE_PROJECT_ID: "hushh-tech-uat"
  VITE_FIREBASE_APP_ID: "ci-app-id"
  VITE_GCP_AUTH_REDIRECT_URL: "https://hushhtech.com/auth/callback"
  VITE_PLAID_REDIRECT_URI: "https://hushhtech.com/onboarding/financial-link"
  VITE_ALLOW_INSECURE_BROWSER_LLM: "false"
  HUSHH_RESEARCH_CLIENT_ENABLED: "false"

jobs:
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Signed-off-by trailers
        run: npm run dco:check

      - name: Upload DCO report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dco-report
          if-no-files-found: error
          retention-days: 7
          path: tmp/ci/dco-report.txt

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run secret scan
        run: bash scripts/ci/orchestrate.sh secret

  env-contract:
    name: Env Contract Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate environment contract
        run: bash scripts/ci/orchestrate.sh env

      - name: Upload env contract report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: env-contract-report
          if-no-files-found: error
          retention-days: 7
          path: tmp/ci/env-contract-report.json

  supabase-retirement-contract:
    name: Supabase Retirement Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate frozen migration inventory
        run: bash scripts/ci/orchestrate.sh retirement

  no-hybrid-runtime:
    name: No-Hybrid Runtime Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Prove source, build, and browser are GCP-only
        run: bash scripts/ci/orchestrate.sh no-hybrid

      - name: Upload no-hybrid report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: no-hybrid-runtime-report
          if-no-files-found: error
          retention-days: 7
          path: tmp/ci/no-hybrid-runtime-report.json

  gcp-service-foundation:
    name: GCP Service Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.SERVICE_NODE_VERSION }}
          cache: npm
          cache-dependency-path: cloud-run/hushh-tech-app-services/package-lock.json

      - name: Validate the fail-closed Cloud Run service package
        run: bash scripts/ci/orchestrate.sh service

  gcp-cloudsql-attestor:
    name: GCP Cloud SQL Attestor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ATTESTOR_NODE_VERSION }}
          cache: npm
          cache-dependency-path: cloud-run/hushh-tech-cloudsql-attestor/package-lock.json

      - name: Install pinned attestor dependencies
        run: npm --prefix cloud-run/hushh-tech-cloudsql-attestor ci

      - name: Validate the network-off Cloud SQL attestor
        run: npm run gcp:migration:check-cloudsql-attestor

      - name: Reject vulnerable runtime dependencies
        run: npm --prefix cloud-run/hushh-tech-cloudsql-attestor audit --omit=dev --audit-level=high

  reviewer-context:
    name: Reviewer Context & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify grounding sources exist
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            ".pr_agent.toml"
            ".ai_config.toml"
            "AGENTS.md"
            "QODO.MD"
            "best_practices.md"
            "docs/project_context_map.md"
            "pr_compliance_checklist.yaml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required reviewer grounding or compliance file is missing."
              exit 1
            fi
          done

      - name: Validate reviewer config TOML
        shell: bash
        run: |
          python3 - <<'PY'
          import tomllib

          with open(".pr_agent.toml", "rb") as fh:
              pr_agent = tomllib.load(fh)

          with open(".ai_config.toml", "rb") as fh:
              tomllib.load(fh)

          config = pr_agent.get("config", {})
          if config.get("add_repo_metadata") is not True:
              raise SystemExit(".pr_agent.toml must enable add_repo_metadata = true")

          metadata_files = set(config.get("add_repo_metadata_file_list", []))
          required_metadata = {"AGENTS.md", "QODO.MD", "pr_compliance_checklist.yaml"}
          missing = sorted(required_metadata - metadata_files)
          if missing:
              raise SystemExit(
                  ".pr_agent.toml must ingest AGENTS.md, QODO.MD, and pr_compliance_checklist.yaml; missing: "
                  + ", ".join(missing)
              )
          PY

      - name: Validate compliance checklist YAML
        shell: bash
        run: ruby -e 'require "yaml"; YAML.load_file("pr_compliance_checklist.yaml")'

  pr-hygiene:
    name: PR Hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate PR template completeness
        run: npm run pr:hygiene

      - name: Upload PR hygiene report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pr-hygiene-report
          if-no-files-found: error
          retention-days: 7
          path: tmp/ci/pr-hygiene-report.json

  phase2-pr-policy:
    name: Phase 2 PR Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate invite-only Phase 2 PR policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-phase2-pr-policy.mjs

      - name: Upload Phase 2 PR policy report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase2-pr-policy-report
          if-no-files-found: error
          retention-days: 7
          path: tmp/ci/phase2-pr-policy-report.json

  semantic-pr-guard:
    name: Semantic PR Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run semantic PR guard in advisory mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_PR_GUARD_MODE: advisory
        run: node scripts/ci/check-pr-semantic-guardrails.mjs

      - name: Upload semantic PR guard report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: semantic-pr-guard-report
          if-no-files-found: error
          retention-days: 7
          path: tmp/ci/semantic-pr-guard-report.json

  web-validation:
    name: Web Validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test, type-check, and build
        run: bash scripts/ci/orchestrate.sh web

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run phased lint checks
        run: bash scripts/ci/orchestrate.sh lint

      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: eslint-full-report
          if-no-files-found: error
          retention-days: 7
          path: tmp/ci/eslint-full-report.json

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture npm audit report
        run: |
          mkdir -p tmp/ci
          npm audit --json > tmp/ci/npm-audit-report.json || true

      - name: Enforce audit regression budget
        run: node scripts/ci/check-audit-regression.mjs tmp/ci/npm-audit-report.json

      - name: Upload audit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          if-no-files-found: error
          retention-days: 7
          path: tmp/ci/npm-audit-report.json

  sensitive-nda-gate:
    name: Sensitive NDA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sensitive community API gate regressions
        run: npm run test -- tests/communityApiRoute.test.ts tests/communityGcpRuntime.test.ts

      - name: Syntax-check live NDA gate verifier
        run: node --check scripts/community/verify-sensitive-nda-gate.mjs

  ci-status:
    name: CI Status Gate
    if: always()
    needs:
      - dco
      - secret-scan
      - env-contract
      - supabase-retirement-contract
      - no-hybrid-runtime
      - gcp-service-foundation
      - gcp-cloudsql-attestor
      - reviewer-context
      - pr-hygiene
      - phase2-pr-policy
      - web-validation
      - lint
      - security-audit
      - sensitive-nda-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate upstream job outcomes
        shell: bash
        run: |
          declare -A REQUIRED_RESULTS=(
            ["DCO"]="${{ needs.dco.result }}"
            ["Secret Scan"]="${{ needs.secret-scan.result }}"
            ["Env Contract Check"]="${{ needs.env-contract.result }}"
            ["Supabase Retirement Contract"]="${{ needs.supabase-retirement-contract.result }}"
            ["No-Hybrid Runtime Gate"]="${{ needs.no-hybrid-runtime.result }}"
            ["GCP Service Foundation"]="${{ needs.gcp-service-foundation.result }}"
            ["GCP Cloud SQL Attestor"]="${{ needs.gcp-cloudsql-attestor.result }}"
            ["Reviewer Context & Compliance"]="${{ needs.reviewer-context.result }}"
            ["PR Hygiene"]="${{ needs.pr-hygiene.result }}"
            ["Phase 2 PR Policy"]="${{ needs.phase2-pr-policy.result }}"
            ["Web Validation"]="${{ needs.web-validation.result }}"
            ["Lint"]="${{ needs.lint.result }}"
            ["Security Audit"]="${{ needs.security-audit.result }}"
            ["Sensitive NDA Gate"]="${{ needs.sensitive-nda-gate.result }}"
          )

          failed=0
          for job in "${!REQUIRED_RESULTS[@]}"; do
            result="${REQUIRED_RESULTS[$job]}"
            echo "$job => $result"
            if [ "$job" = "PR Hygiene" ] && [ "$result" = "skipped" ]; then
              continue
            fi
            if [ "$job" = "Phase 2 PR Policy" ] && [ "$result" = "skipped" ]; then
              continue
            fi
            if [ "$job" = "DCO" ] && [ "$result" = "skipped" ]; then
              continue
            fi
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more required PR validation jobs failed."
            exit 1
          fi
