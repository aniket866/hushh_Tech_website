name: Cloud Build Status Gate

# Cloud Build owns the expensive PR code gate. This small status adapter joins
# its GitHub check with the metadata-only PR Policy Gate and publishes the
# existing required `CI Status Gate` commit status. Queue Validation continues
# to publish that same context for GitHub merge_group freshness checks.
on:
  check_run:
    types:
      - completed

permissions:
  contents: read
  checks: read
  pull-requests: read
  statuses: write

concurrency:
  group: cloudbuild-status-${{ github.event.check_run.head_sha }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish CI Status Gate
    if: >-
      github.event.check_run.name == 'PR Policy Gate' ||
      contains(github.event.check_run.name, 'hushh-tech-website-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join Cloud Build and PR policy results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.check_run.head_sha }}
          EVENT_NAME: ${{ github.event.check_run.name }}
        shell: bash
        run: |
          set -euo pipefail

          checks="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/${SHA}/check-runs?per_page=100")"

          cloud_state="$(jq -r '
            [.check_runs[]
              | select(.name | contains("hushh-tech-website-ci"))]
            | sort_by(.started_at // "")
            | if length == 0 then "missing" else .[-1].conclusion // "pending" end
          ' <<<"${checks}")"
          policy_state="$(jq -r '
            [.check_runs[] | select(.name == "PR Policy Gate")]
            | sort_by(.started_at // "")
            | if length == 0 then "missing" else .[-1].conclusion // "pending" end
          ' <<<"${checks}")"

          state="pending"
          if [[ "${cloud_state}" =~ ^(failure|timed_out|cancelled|action_required|startup_failure)$ ||
                "${policy_state}" =~ ^(failure|timed_out|cancelled|action_required|startup_failure)$ ]]; then
            state="failure"
          elif [[ "${cloud_state}" == "success" && "${policy_state}" == "success" ]]; then
            state="success"
          fi

          case "${state}" in
            success) description="Cloud Build code gates and PR policy passed" ;;
            failure) description="Cloud Build code gates or PR policy failed" ;;
            *) description="Waiting for Cloud Build code gates and PR policy" ;;
          esac

          payload="$(jq -cn \
            --arg state "${state}" \
            --arg description "${description}" \
            --arg target_url "https://github.com/${REPOSITORY}/commit/${SHA}" \
            '{state:$state, context:"CI Status Gate", description:$description, target_url:$target_url}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${SHA}" \
            -d "${payload}"

          echo "${EVENT_NAME}: Cloud Build=${cloud_state}, PR Policy=${policy_state}, CI Status Gate=${state}"
