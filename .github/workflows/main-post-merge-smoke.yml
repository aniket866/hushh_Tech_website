name: Main Post-Merge Smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-post-merge-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.19.0"
  VITE_FIREBASE_AUTH_DOMAIN: "hushh-tech-uat.firebaseapp.com"
  VITE_FIREBASE_API_KEY: "ci-anon-key"
  VITE_FIREBASE_PROJECT_ID: "hushh-tech-uat"
  VITE_FIREBASE_APP_ID: "ci-app-id"
  VITE_GCP_AUTH_REDIRECT_URL: "https://hushhtech.com/auth/callback"
  VITE_PLAID_REDIRECT_URI: "https://hushhtech.com/onboarding/financial-link"
  VITE_ALLOW_INSECURE_BROWSER_LLM: "false"
  HUSHH_RESEARCH_CLIENT_ENABLED: "false"

jobs:
  smoke-gate:
    name: Main Post-Merge Smoke Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exhaustive route inventory
        run: npm run migration:no-hybrid:routes

      - name: Validate no-hybrid source contract
        run: npm run migration:no-hybrid:source

      - name: Validate frozen migration inventory
        run: bash scripts/ci/orchestrate.sh retirement

      - name: Build green main artifact
        run: npm run build:web

      - name: Validate no-hybrid deploy artifact
        run: npm run migration:no-hybrid:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Validate no-hybrid browser network
        run: npm run test:e2e:no-hybrid

      - name: Run compact smoke suite
        env:
          SMOKE_REPORT_PATH: /tmp/ci/main-post-merge-smoke.json
        run: bash scripts/ci/orchestrate.sh smoke

      - name: Upload smoke artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: main-post-merge-smoke
          if-no-files-found: error
          retention-days: 7
          path: /tmp/ci/main-post-merge-smoke.json
